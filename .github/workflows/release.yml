name: release

# Push a tag like v0.1.0. The tag must match pyproject's version, the suite
# must pass, and the notes come from that version's CHANGELOG section -- so a
# release cannot say something the changelog does not.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject $v"; exit 1; }
      - run: pip install -e ".[dev]" build
      - run: pytest -q
      - run: python -m tti verify
      - run: python -m build
      # What a user actually gets: install the wheel into a clean venv and
      # list that environment, rather than the build machine's.
      - name: SBOM (CycloneDX) for the installed wheel
        run: |
          python -m venv /tmp/app && /tmp/app/bin/pip install -q dist/*.whl
          pip install -q cyclonedx-bom
          cyclonedx-py environment /tmp/app/bin/python --output-format JSON -o dist/sbom.cdx.json
      - name: Ledger snapshot and checksums
        run: |
          tar -czf "dist/ledger-${GITHUB_REF_NAME}.tar.gz" ledger RESULTS.md
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $v"; exit 1; }
          {
            echo
            echo "**Install:** \`pip install git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}\`"
            echo
            echo "**Assurance:** test suite and \`tti verify\` passed on this commit ($(git rev-parse --short HEAD)); SHA-256 for every attached file is in \`SHA256SUMS\`; dependencies are listed in \`sbom.cdx.json\` (CycloneDX)."
          } >> notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            notes.md

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*

  # Off until PyPI trusted publishing is configured for this repository; then
  # set the repository variable PUBLISH_PYPI to "true". See docs/RELEASING.md.
  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: rm -f dist/SHA256SUMS dist/ledger-*.tar.gz dist/sbom.cdx.json
      - uses: pypa/gh-action-pypi-publish@release/v1
