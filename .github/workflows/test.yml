name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: pip install -e ".[dev]"

      # The suite makes no network calls. That is deliberate: a test run that
      # depends on a live registry fails for reasons unrelated to the change,
      # and a benchmark whose own CI is flaky has no standing to publish
      # reliability numbers about anyone else.
      - name: Tests
        run: pytest -q

      - name: Lint
        run: ruff check tti tests

      - name: The estimator must recover its own ground truth
        run: tti demo

      # Every command that needs neither keys nor network. A change that
      # breaks CLI wiring fails here rather than at 3am in a cron job, which
      # is how an undefined name in `tti report` once reached the repository
      # with the whole unit suite green.
      - name: CLI smoke
        run: |
          set -e
          tti --version
          tti --run-dir "$RUNNER_TEMP/ledger" status
          tti --run-dir "$RUNNER_TEMP/ledger" probe --dry-run
          tti --run-dir "$RUNNER_TEMP/ledger" score      || [ $? -eq 1 ]
          tti --run-dir "$RUNNER_TEMP/ledger" regrade    || [ $? -eq 1 ]
          tti --run-dir "$RUNNER_TEMP/ledger" sensitivity || [ $? -eq 1 ]
          tti --run-dir "$RUNNER_TEMP/ledger" watch --report || [ $? -eq 1 ]
          tti placeholder --out-dir "$RUNNER_TEMP/pages"
          tti demo        --out-dir "$RUNNER_TEMP/pages"
          tti --run-dir "$RUNNER_TEMP/ledger" report --out-dir "$RUNNER_TEMP/pages" \
            || [ $? -eq 1 ]

      # A configuration error must exit 2 — not crash, and not quietly
      # substitute defaults. This once silently changed the daily spend cap.
      - name: Configuration is validated, not defaulted
        run: |
          printf 'ladder: [300]\ndaily_usd_cap: -1\n' > data/settings.yaml
          set +e
          tti --run-dir "$RUNNER_TEMP/ledger" status
          rc=$?
          set -e
          git checkout -- data/settings.yaml
          if [ "$rc" -ne 2 ]; then
            echo "expected exit 2 for a bad config, got $rc"
            exit 1
          fi
