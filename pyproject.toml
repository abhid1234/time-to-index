[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-to-index"
version = "0.1.0"
description = "A freshness and staleness benchmark for web-search APIs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abhijit Das"}]
keywords = [
  "benchmark", "web-search", "search-api", "freshness", "staleness",
  "llm-agents", "rag", "information-retrieval", "survival-analysis",
  "interval-censoring",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
# Two runtime code dependencies on purpose. A benchmark nobody can install is
# a blog post; every extra dep is another reason a fork does not happen.
# tzdata is data, not code: the IANA zone database, for the EDGAR and Federal
# Register collectors on systems that ship without one (slim containers).
dependencies = ["requests>=2.31", "PyYAML>=6.0", "tzdata>=2024.1"]

[project.urls]
Homepage = "https://abhid1234.github.io/time-to-index/"
Playground = "https://abhid1234.github.io/time-to-index/playground.html"
Repository = "https://github.com/abhid1234/time-to-index"
Issues = "https://github.com/abhid1234/time-to-index/issues"
Changelog = "https://github.com/abhid1234/time-to-index/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
tti = "tti.cli:main"

[tool.setuptools.packages.find]
include = ["tti*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",    # line length is enforced by the formatter, not the linter
  "B008",    # false positives on dataclass field(default_factory=...)
  "SIM108",  # ternaries are not always clearer than the if/else they replace
]

[tool.ruff.lint.per-file-ignores]
# Collectors are written as one over-indented method body each, converted from
# a loop; the shape keeps the diff against the original readable.
"tti/sources/*.py" = ["E117"]
"tests/*.py" = ["E402"]  # sys.path insert before imports is the point
