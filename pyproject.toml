[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-to-index"
version = "0.1.0"
description = "A freshness and staleness benchmark for web-search APIs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Two runtime dependencies on purpose. A benchmark nobody can install is a
# blog post; every extra dep is another reason a fork does not happen.
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
tti = "tti.cli:main"

[tool.setuptools.packages.find]
include = ["tti*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",    # line length is enforced by the formatter, not the linter
  "B008",    # false positives on dataclass field(default_factory=...)
  "SIM108",  # ternaries are not always clearer than the if/else they replace
]

[tool.ruff.lint.per-file-ignores]
# Collectors are written as one over-indented method body each, converted from
# a loop; the shape keeps the diff against the original readable.
"tti/sources/*.py" = ["E117"]
"tests/*.py" = ["E402"]  # sys.path insert before imports is the point
