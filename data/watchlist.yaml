# arXiv and the Federal Register publish on their own schedule regardless of
# what is watched, so their volume is set by how deep each poll reads rather
# than by list length. Neither supports supersession, so both add
# time-to-index volume and nothing to the staleness denominator -- which is
# why the npm/pypi/releases/filings rate is reported separately by
# `tti forecast`.
arxiv:
  - cs.AI
  - cs.CL
  - cs.IR
  - cs.LG
  - cs.SE
  - cs.DB
