# Subjects polled for new events.
#
# Selection rule: high release cadence, unambiguous names, and a real chance
# an agent gets asked about them. A package that ships twice a year
# contributes almost nothing; a package that ships weekly contributes an
# event a week to every provider's curve.

# Subjects polled for new events.
#
# Selection is measured, not guessed. `tti forecast` reads each subject's
# published release history and reports the corpus event rate; this list is
# what survived two filters run against sixty days of real registry data:
#
#   Cadence.  A package that ships twice a year contributes almost nothing
#   while still costing a poll every cycle. 32 of 150 candidates shipped
#   nothing in sixty days and were dropped.
#
#   Concentration.  No subject may exceed ~6% of the corpus. Two candidates
#   did -- one at 16% on its own -- and a benchmark whose events are that
#   concentrated is substantially measuring how fast providers index one
#   package, since provider behaviour can be subject-specific.
#
# Result: 46 npm + 48 pypi subjects, 13.1 events/day,
# top subject 6.6%, 44 effective subjects by Herfindahl. That puts a hazard
# ratio of 2 within reach in about five days and 1.5 in about fifteen.

