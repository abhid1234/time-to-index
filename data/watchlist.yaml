# Subjects polled for new events.
#
# Selection rule: high release cadence, unambiguous names, and a real chance
# an agent gets asked about them. A package that ships twice a year
# contributes almost nothing; a package that ships weekly contributes an
# event a week to every provider's curve.

npm:
  - next
  - vite
  - typescript
  - react
  - "@types/node"
  - eslint
  - tailwindcss
  - zod
  - vitest
  - prisma
  - langchain
  - "@anthropic-ai/sdk"
  - openai
  - drizzle-orm
  - hono
  - astro
  - svelte
  - playwright
  - turbo
  - bun-types

pypi:
  - pydantic
  - fastapi
  - langchain
  - openai
  - anthropic
  - transformers
  - polars
  - duckdb
  - ruff
  - uv
  - httpx
  - litellm
  - vllm
  - datasets
  - sqlalchemy
  - dspy
  - instructor
  - mlflow

