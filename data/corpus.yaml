# Pages an agent would plausibly need to read, grouped by what kind of answer
# they carry. Deliberately not a popularity list: the question is not which
# sites get traffic, it is which pages an agent gets sent to when someone asks
# a factual question and expects a citation.
#
# Every entry is a deep page, not a homepage. Homepages are marketing and are
# almost always server-rendered; the interesting failures are on the detail
# pages where the actual fact lives.

